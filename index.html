<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Screen.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        #mapWrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #mapImage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
        }

        .button-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .level-button {
            position: absolute;
            width: 140px;
            height: 140px;
            background: url('./rock.png') no-repeat center/contain;
            border: none;
            color: rgb(89,43,23);
            font-family: 'Fredoka', system-ui, sans-serif;
            font-size: 56px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 18px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            transition: transform 0.25s ease;
        }

            .level-button:hover {
                transform: translate(-50%, -50%) scale(1.12);
            }

            .level-button.click-animation {
                animation: clickEffect 0.6s ease;
            }

        @keyframes clickEffect {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(0.85);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Frog GIF styling (looping) */
        #frog {
            position: absolute;
            width: 192px; /* 2x size */
            left: 748px;
            top: 898px;
            pointer-events: none; /* not draggable */
            user-select: none;
            z-index: 30;
        }

        @media (max-width:768px) {
            .level-button {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            #frog {
                width: 120px;
            }
        }
    </style>
</head>

<body>
    <div id="mapWrapper">
        <img id="mapImage" src="./Untitled.png" alt="Map">
        <div class="button-container" id="buttonContainer"></div>

        <!-- Normal looping GIF -->
        <img id="frog" src="./frog.gif" alt="Frog">
    </div>

    <script>
        /* =====================================================
        BUTTONS
        ===================================================== */
        const BUTTON_POSITIONS = [
        { x:0.0563, y:0.1162 }, { x:0.1680, y:0.2488 }, { x:0.1742, y:0.4780 },
        { x:0.2199, y:0.7237 }, { x:0.3496, y:0.6750 }, { x:0.4043, y:0.4639 },
        { x:0.5016, y:0.2998 }, { x:0.6082, y:0.4843 }, { x:0.6859, y:0.6601 },
        { x:0.7902, y:0.4945 }, { x:0.8949, y:0.4741 }, { x:0.9406, y:0.7590 }
        ];

        const wrapper = document.getElementById('mapWrapper');
        const container = document.getElementById('buttonContainer');
        const buttons = [];
        let currentLevel = 1;

        function placeButtons() {
        const w = wrapper.clientWidth;
        const h = wrapper.clientHeight;
        buttons.forEach((btn,i)=>{
        const p=BUTTON_POSITIONS[i];
        btn.style.left=`${p.x*w}px`;
        btn.style.top=`${p.y*h}px`;
        });
        }

        function createButtons() {
        container.innerHTML='';
        buttons.length=0;
        BUTTON_POSITIONS.forEach((_,i)=>{
        const btn=document.createElement('div');
        btn.className='level-button';
        btn.textContent=i+1;
        btn.dataset.level=i+1;

        btn.addEventListener('click', function(){
        if(+this.dataset.level===currentLevel){
        this.classList.add('click-animation');
        setTimeout(()=>this.classList.remove('click-animation'),600);
        currentLevel++;
        }
        });

        container.appendChild(btn);
        buttons.push(btn);
        });
        placeButtons();
        }

        window.addEventListener('resize', placeButtons);
        window.addEventListener('load', createButtons);
    </script>
</body>
</html>
