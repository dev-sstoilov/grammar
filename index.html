<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Граматика БГ - Учи български език забавно!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce-in {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .celebration {
            animation: bounce-in 0.5s ease-out;
        }
        
        .shake {
            animation: shake 0.5s ease-out;
        }
        
        .dragging {
            opacity: 0.5;
            transform: scale(1.1);
        }
        
        body {
            background: linear-gradient(135deg, #fda4af 0%, #c084fc 50%, #93c5fd 100%);
            min-height: 100vh;
        }
        
        .gradient-text {
            background: linear-gradient(to right, #9333ea, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="p-8">
    <!-- Celebration Overlay -->
    <div id="celebrationOverlay" class="hidden fixed inset-0 flex items-center justify-center pointer-events-none z-50">
        <div class="text-9xl celebration">🎉</div>
    </div>

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-3xl shadow-2xl p-6 mb-8">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-20 h-20 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center shadow-lg">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-4xl font-bold gradient-text">Граматика БГ</h1>
                        <p class="text-gray-600">Учи български език забавно!</p>
                    </div>
                </div>
                
                <div class="flex gap-6">
                    <div class="text-center">
                        <div class="flex items-center gap-2 bg-yellow-100 px-6 py-3 rounded-2xl">
                            <svg class="w-8 h-8 text-yellow-500" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                            </svg>
                            <span id="scoreDisplay" class="text-3xl font-bold text-yellow-700">0</span>
                        </div>
                        <p class="text-sm text-gray-600 mt-1">Точки</p>
                    </div>
                    
                    <div class="text-center">
                        <div class="flex items-center gap-2 bg-green-100 px-6 py-3 rounded-2xl">
                            <svg class="w-8 h-8 text-green-500" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path>
                            </svg>
                            <span id="correctDisplay" class="text-3xl font-bold text-green-700">0</span>
                        </div>
                        <p class="text-sm text-gray-600 mt-1">Верни</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Subject Selection -->
        <div class="bg-white rounded-3xl shadow-2xl p-6 mb-8">
            <div class="flex gap-4 flex-wrap">
                <button onclick="switchSubject('dragdrop')" id="btnDragDrop" class="flex-1 min-w-64 py-4 rounded-2xl font-bold text-xl transition-all bg-gradient-to-r from-blue-500 to-purple-500 text-white shadow-lg scale-105">
                    📝 Попълни изречението
                </button>
                
                <button onclick="switchSubject('partsOfSpeech')" id="btnPartsOfSpeech" class="flex-1 min-w-64 py-4 rounded-2xl font-bold text-xl transition-all bg-gray-200 text-gray-700 hover:bg-gray-300">
                    🎯 Части на речта
                </button>
            </div>
        </div>

        <!-- Question Area -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 mb-8">
            <!-- Loading State -->
            <div id="loadingState" class="hidden text-center py-20">
                <div class="w-20 h-20 border-8 border-purple-200 border-t-purple-600 rounded-full animate-spin mx-auto"></div>
                <p class="text-2xl text-gray-600 mt-4">Зареждам въпрос...</p>
            </div>

            <!-- Drag and Drop Question -->
            <div id="dragDropQuestion" class="space-y-8 hidden">
                <div class="flex items-center gap-2 bg-white/50 p-4 rounded-2xl flex-wrap">
                    <button onclick="speakText(currentQuestionText)" class="p-3 bg-purple-500 hover:bg-purple-600 rounded-full transition-all hover:scale-110">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                        </svg>
                    </button>
                    <div id="sentenceDisplay" class="text-2xl font-bold text-gray-800 flex-1 flex flex-wrap items-center gap-3"></div>
                </div>
                
                <div id="wordBank" class="flex flex-wrap gap-4 justify-center p-6 bg-gradient-to-r from-blue-100 to-purple-100 rounded-3xl min-h-32"></div>
            </div>

            <!-- Parts of Speech Question -->
            <div id="partsOfSpeechQuestion" class="space-y-8 hidden">
                <!-- Explanation Mode -->
                <div id="explanationMode" class="hidden space-y-6">
                    <div class="bg-gradient-to-r from-yellow-100 to-orange-100 p-8 rounded-3xl shadow-lg">
                        <div class="flex items-center gap-3 mb-4">
                            <svg class="w-10 h-10 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                            <h3 id="explanationTitle" class="text-3xl font-bold text-orange-700"></h3>
                        </div>
                        <button onclick="speakText(currentExplanationText)" class="mb-4 p-3 bg-orange-500 hover:bg-orange-600 rounded-full transition-all hover:scale-110">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                            </svg>
                        </button>
                        <p id="explanationText" class="text-xl text-gray-700 leading-relaxed mb-6"></p>
                        
                        <div class="bg-white p-6 rounded-2xl">
                            <h4 class="text-xl font-bold text-gray-700 mb-3">Примери:</h4>
                            <div id="examplesList"></div>
                        </div>
                    </div>
                    
                    <button onclick="continueAfterExplanation()" class="w-full py-4 bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white text-2xl font-bold rounded-2xl shadow-lg transition-all hover:scale-105">
                        Готов съм да практикувам! 🚀
                    </button>
                </div>

                <!-- Practice Mode -->
                <div id="practiceMode" class="hidden space-y-8">
                    <div class="flex items-center gap-2 bg-white/50 p-6 rounded-2xl flex-wrap">
                        <button onclick="speakCurrentPartQuestion()" class="p-3 bg-purple-500 hover:bg-purple-600 rounded-full transition-all hover:scale-110">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                            </svg>
                        </button>
                        <div class="text-2xl font-bold text-gray-800">
                            Натисни на <span id="partToFind" class="text-purple-600"></span> в изречението:
                        </div>
                    </div>
                    
                    <div class="bg-gradient-to-r from-pink-100 to-purple-100 p-8 rounded-3xl">
                        <div id="wordsToClick" class="text-3xl font-bold text-gray-800 flex flex-wrap gap-4 justify-center"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 flex-wrap">
            <button onclick="generateQuestion()" class="flex-1 min-w-64 py-4 bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-500 hover:to-blue-600 text-white text-xl font-bold rounded-2xl shadow-lg transition-all hover:scale-105">
                ⏭️ Следващ въпрос
            </button>
            
            <button id="testButton" onclick="startTest()" class="hidden flex-1 min-w-64 py-4 bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white text-xl font-bold rounded-2xl shadow-lg transition-all hover:scale-105">
                🏆 Започни тест
            </button>
        </div>

        <!-- Test Mode Indicator -->
        <div id="testModeIndicator" class="hidden mt-6 bg-gradient-to-r from-yellow-200 to-orange-200 p-6 rounded-2xl text-center">
            <p class="text-2xl font-bold text-orange-700">
                Тест режим: <span id="testProgress">0/0</span> верни (Нужни 4/5 за да минеш)
            </p>
        </div>

        <!-- Learned Parts -->
        <div id="learnedParts" class="hidden mt-6 bg-white rounded-2xl shadow-lg p-6">
            <h3 class="text-xl font-bold text-gray-700 mb-3">Научени части на речта:</h3>
            <div id="learnedPartsList" class="flex flex-wrap gap-3"></div>
        </div>
    </div>

    <script>
        // Game State
        let currentSubject = 'dragdrop';
        let currentQuestion = null;
        let score = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let difficulty = 1;
        let isTestMode = false;
        let testScore = 0;
        let testQuestions = 0;
        let partsOfSpeechLearned = [];
        let currentPartOfSpeech = null;
        let isExplaining = false;
        let draggedItems = {};
        let currentQuestionText = '';
        let currentExplanationText = '';

        const partsOfSpeech = [
            { name: 'Съществително', description: 'Думи, които означават хора, животни, предмети или места' },
            { name: 'Глагол', description: 'Думи, които показват действие или състояние' },
            { name: 'Прилагателно', description: 'Думи, които описват съществителни имена' },
            { name: 'Местоимение', description: 'Думи, които заместват съществителни имена' },
            { name: 'Наречие', description: 'Думи, които описват как, кога, къде или колко се случва действието' },
        ];

        // Text to Speech
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bg-BG';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentPartQuestion() {
            const partName = document.getElementById('partToFind').textContent;
            const sentence = currentQuestion?.sentence || '';
            speakText(`Натисни на ${partName} в изречението: ${sentence}`);
        }

        // Switch Subject
        function switchSubject(subject) {
            currentSubject = subject;
            isExplaining = false;
            
            document.getElementById('btnDragDrop').className = subject === 'dragdrop' 
                ? 'flex-1 min-w-64 py-4 rounded-2xl font-bold text-xl transition-all bg-gradient-to-r from-blue-500 to-purple-500 text-white shadow-lg scale-105'
                : 'flex-1 min-w-64 py-4 rounded-2xl font-bold text-xl transition-all bg-gray-200 text-gray-700 hover:bg-gray-300';
            
            document.getElementById('btnPartsOfSpeech').className = subject === 'partsOfSpeech' 
                ? 'flex-1 min-w-64 py-4 rounded-2xl font-bold text-xl transition-all bg-gradient-to-r from-pink-500 to-orange-500 text-white shadow-lg scale-105'
                : 'flex-1 min-w-64 py-4 rounded-2xl font-bold text-xl transition-all bg-gray-200 text-gray-700 hover:bg-gray-300';
            
            generateQuestion();
        }

        // Show celebration
        function showCelebration() {
            const overlay = document.getElementById('celebrationOverlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('hidden'), 2000);
        }

        // Update UI
        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('correctDisplay').textContent = correctAnswers;
            
            if (correctAnswers >= 5 && !isTestMode) {
                document.getElementById('testButton').classList.remove('hidden');
            }
            
            if (partsOfSpeechLearned.length > 0 && currentSubject === 'partsOfSpeech') {
                document.getElementById('learnedParts').classList.remove('hidden');
                const list = document.getElementById('learnedPartsList');
                list.innerHTML = partsOfSpeechLearned.map(part => 
                    `<div class="px-4 py-2 bg-gradient-to-r from-green-400 to-emerald-500 text-white rounded-xl font-bold shadow">✓ ${part}</div>`
                ).join('');
            }
        }

        // Generate Question
        async function generateQuestion() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('dragDropQuestion').classList.add('hidden');
            document.getElementById('partsOfSpeechQuestion').classList.add('hidden');
            
            let prompt = '';
            
            if (currentSubject === 'dragdrop') {
                const blanks = difficulty === 1 ? 1 : difficulty === 2 ? 2 : 3;
                prompt = `Generate a simple Bulgarian sentence suitable for children with ${blanks} word(s) missing. Return ONLY a JSON object with this exact structure:
{
  "sentence": "The sentence with ___BLANK___ markers where words should go",
  "correctWords": ["word1", "word2"],
  "distractors": ["wrong1", "wrong2", "wrong3"]
}
Make it about everyday topics kids understand. Ensure distractors are obviously wrong.`;
            } else if (currentSubject === 'partsOfSpeech') {
                if (!currentPartOfSpeech || isExplaining) {
                    const nextPart = partsOfSpeech.find(p => !partsOfSpeechLearned.includes(p.name));
                    if (nextPart) {
                        currentPartOfSpeech = nextPart.name;
                        isExplaining = true;
                        prompt = `Explain "${nextPart.name}" (${nextPart.description}) in Bulgarian to a 4th grader with 2-3 simple examples. Then provide a simple sentence and ask the child to identify the ${nextPart.name}. Return ONLY a JSON object:
{
  "explanation": "Your explanation in Bulgarian",
  "examples": ["example1", "example2"],
  "sentence": "Test sentence",
  "words": ["word1", "word2", "word3"],
  "correctIndex": 0
}`;
                    } else {
                        const learnedParts = partsOfSpeechLearned.join(', ');
                        prompt = `Create a simple Bulgarian sentence with words that are: ${learnedParts}. Ask the child to identify one specific part. Return ONLY a JSON object:
{
  "sentence": "Test sentence",
  "words": ["word1", "word2", "word3"],
  "correctIndex": 0,
  "partToFind": "Съществително"
}`;
                    }
                } else {
                    prompt = `Create a simple Bulgarian sentence for a 4th grader. Ask them to identify the ${currentPartOfSpeech}. Return ONLY a JSON object:
{
  "sentence": "Test sentence",
  "words": ["word1", "word2", "word3", "word4"],
  "correctIndex": 1
}`;
                }
            }

            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 1000,
                        messages: [
                            { role: "user", content: prompt }
                        ],
                    })
                });

                const data = await response.json();
                const text = data.content.map(item => item.type === "text" ? item.text : "").join("\n");
                const cleanText = text.replace(/```json|```/g, "").trim();
                currentQuestion = JSON.parse(cleanText);
                
                renderQuestion();
            } catch (error) {
                console.error('Error generating question:', error);
                // Fallback
                if (currentSubject === 'dragdrop') {
                    currentQuestion = {
                        sentence: "Котката ___BLANK___ на дървото.",
                        correctWords: ["се катери"],
                        distractors: ["плува", "лети", "говори"]
                    };
                    renderQuestion();
                }
            }
            
            document.getElementById('loadingState').classList.add('hidden');
        }

        // Render Question
        function renderQuestion() {
            if (currentSubject === 'dragdrop') {
                renderDragDropQuestion();
            } else if (currentSubject === 'partsOfSpeech') {
                renderPartsOfSpeechQuestion();
            }
        }

        // Render Drag and Drop
        function renderDragDropQuestion() {
            document.getElementById('dragDropQuestion').classList.remove('hidden');
            
            const parts = currentQuestion.sentence.split('___BLANK___');
            currentQuestionText = currentQuestion.sentence.replace(/___BLANK___/g, '');
            
            const sentenceDisplay = document.getElementById('sentenceDisplay');
            sentenceDisplay.innerHTML = '';
            draggedItems = {};
            
            parts.forEach((part, i) => {
                const span = document.createElement('span');
                span.textContent = part;
                sentenceDisplay.appendChild(span);
                
                if (i < parts.length - 1) {
                    const dropZone = document.createElement('div');
                    dropZone.className = 'inline-flex items-center justify-center min-w-32 h-16 border-4 border-dashed rounded-xl transition-all bg-yellow-100 border-yellow-400 hover:border-yellow-500 hover:scale-105';
                    dropZone.dataset.slotIndex = i;
                    dropZone.innerHTML = '<span class="text-yellow-600">___</span>';
                    
                    dropZone.ondragover = (e) => e.preventDefault();
                    dropZone.ondrop = (e) => handleDrop(e, i);
                    
                    sentenceDisplay.appendChild(dropZone);
                }
            });
            
            const allWords = [...currentQuestion.correctWords, ...currentQuestion.distractors];
            const shuffled = allWords.sort(() => Math.random() - 0.5);
            
            const wordBank = document.getElementById('wordBank');
            wordBank.innerHTML = '';
            
            shuffled.forEach(word => {
                const wordDiv = document.createElement('div');
                wordDiv.className = 'px-6 py-4 bg-white rounded-2xl shadow-lg cursor-move hover:shadow-xl transition-all hover:scale-110 border-4 border-blue-300';
                wordDiv.draggable = true;
                wordDiv.innerHTML = `<span class="text-xl font-bold text-gray-700">${word}</span>`;
                wordDiv.dataset.word = word;
                
                wordDiv.ondragstart = (e) => {
                    e.dataTransfer.setData('word', word);
                    wordDiv.classList.add('dragging');
                };
                
                wordDiv.ondragend = () => {
                    wordDiv.classList.remove('dragging');
                };
                
                wordBank.appendChild(wordDiv);
            });
        }

        function handleDrop(e, slotIndex) {
            e.preventDefault();
            const word = e.dataTransfer.getData('word');
            const dropZone = e.currentTarget;
            
            if (currentQuestion.correctWords[slotIndex] === word) {
                draggedItems[slotIndex] = word;
                dropZone.className = 'inline-flex items-center justify-center min-w-32 h-16 border-4 border-dashed rounded-xl transition-all bg-green-200 border-green-500';
                dropZone.innerHTML = `<span class="text-xl font-bold text-green-700">${word}</span>`;
                
                // Remove from word bank
                const wordBank = document.getElementById('wordBank');
                const wordDivs = wordBank.querySelectorAll('[data-word]');
                wordDivs.forEach(div => {
                    if (div.dataset.word === word) {
                        div.remove();
                    }
                });
                
                // Check if complete
                if (Object.keys(draggedItems).length === currentQuestion.correctWords.length) {
                    handleCorrectAnswer();
                }
            } else {
                dropZone.classList.add('shake');
                dropZone.className = 'inline-flex items-center justify-center min-w-32 h-16 border-4 border-dashed rounded-xl transition-all bg-red-200 border-red-500 shake';
                dropZone.innerHTML = '<svg class="w-8 h-8 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>';
                
                setTimeout(() => {
                    dropZone.className = 'inline-flex items-center justify-center min-w-32 h-16 border-4 border-dashed rounded-xl transition-all bg-yellow-100 border-yellow-400 hover:border-yellow-500 hover:scale-105';
                    dropZone.innerHTML = '<span class="text-yellow-600">___</span>';
                }, 1000);
                
                handleWrongAnswer();
            }
        }

        // Render Parts of Speech
        function renderPartsOfSpeechQuestion() {
            document.getElementById('partsOfSpeechQuestion').classList.remove('hidden');
            
            if (isExplaining && currentQuestion.explanation) {
                document.getElementById('explanationMode').classList.remove('hidden');
                document.getElementById('practiceMode').classList.add('hidden');
                
                document.getElementById('explanationTitle').textContent = `Нека научим за ${currentPartOfSpeech}!`;
                document.getElementById('explanationText').textContent = currentQuestion.explanation;
                currentExplanationText = currentQuestion.explanation;
                
                const examplesList = document.getElementById('examplesList');
                examplesList.innerHTML = currentQuestion.examples?.map(ex => 
                    `<div class="text-lg text-gray-600 mb-2 flex items-center gap-2">
                        <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                        </svg>
                        ${ex}
                    </div>`
                ).join('');
            } else {
                document.getElementById('explanationMode').classList.add('hidden');
                document.getElementById('practiceMode').classList.remove('hidden');
                
                const partToFind = currentQuestion.partToFind || currentPartOfSpeech;
                document.getElementById('partToFind').textContent = partToFind;
                
                const wordsToClick = document.getElementById('wordsToClick');
                wordsToClick.innerHTML = '';
                
                currentQuestion.words?.forEach((word, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'px-6 py-4 rounded-2xl shadow-lg transition-all hover:scale-110 border-4 bg-white border-pink-300 hover:border-pink-500 cursor-pointer';
                    btn.textContent = word;
                    btn.onclick = () => handleWordClick(word, i, btn);
                    wordsToClick.appendChild(btn);
                });
            }
        }

        function handleWordClick(word, index, btn) {
            if (currentQuestion.correctIndex === index) {
                btn.className = 'px-6 py-4 rounded-2xl shadow-lg transition-all border-4 bg-green-300 border-green-600 scale-125';
                btn.innerHTML = `${word} <svg class="inline ml-2 w-6 h-6 text-green-700" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path></svg>`;
                
                setTimeout(() => {
                    handleCorrectAnswer();
                }, 1500);
            } else {
                btn.className = 'px-6 py-4 rounded-2xl shadow-lg transition-all border-4 bg-red-300 border-red-600 shake';
                btn.innerHTML = `${word} <svg class="inline ml-2 w-6 h-6 text-red-700" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>`;
                
                setTimeout(() => {
                    btn.className = 'px-6 py-4 rounded-2xl shadow-lg transition-all hover:scale-110 border-4 bg-white border-pink-300 hover:border-pink-500 cursor-pointer';
                    btn.innerHTML = word;
                }, 1000);
                
                handleWrongAnswer();
            }
        }

        function continueAfterExplanation() {
            isExplaining = false;
            generateQuestion();
        }

        // Handle Answers
        function handleCorrectAnswer() {
            correctAnswers++;
            score += 10;
            showCelebration();
            
            if (isTestMode) {
                testScore++;
                testQuestions++;
                document.getElementById('testProgress').textContent = `${testScore}/${testQuestions}`;
                
                if (testQuestions >= 5) {
                    if (testScore >= 4) {
                        if (currentSubject === 'partsOfSpeech' && currentPartOfSpeech) {
                            partsOfSpeechLearned.push(currentPartOfSpeech);
                            currentPartOfSpeech = null;
                        }
                        alert('🎉 Браво! Издържа теста! Готов си за следващото ниво!');
                    } else {
                        alert('Опитай пак! Трябва ти малко повече практика.');
                    }
                    isTestMode = false;
                    testScore = 0;
                    testQuestions = 0;
                    document.getElementById('testModeIndicator').classList.add('hidden');
                }
            }
            
            updateUI();
            
            setTimeout(() => {
                generateQuestion();
            }, 1500);
        }

        function handleWrongAnswer() {
            wrongAnswers++;
            
            if (wrongAnswers > 0 && wrongAnswers % 3 === 0 && difficulty > 1) {
                difficulty--;
            }
        }

        function startTest() {
            isTestMode = true;
            testScore = 0;
            testQuestions = 0;
            document.getElementById('testModeIndicator').classList.remove('hidden');
            document.getElementById('testProgress').textContent = '0/0';
            generateQuestion();
        }

        // Initialize
        generateQuestion();
    </script>
</body>
</html>
