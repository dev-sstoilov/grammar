<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Граматика за Деца</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @font-face {
            font-family: "ADYSV6-Bold";
            src: url('https://raw.githubusercontent.com/dev-sstoilov/grammar/main/ADYSV6-Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: "ADYSV6-Bold", 'Fredoka', system-ui, sans-serif;
            direction: ltr;
            text-align: center;
        }
        /* Background Wrapper */
        #backgroundWrapper {
            position: fixed;
            inset: 0;
            background: url('https://raw.githubusercontent.com/dev-sstoilov/grammar/refs/heads/main/background.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Main Content Container - Initially hidden */
        #mainContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            max-height: 800px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            border: 8px solid #FFD700;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), inset 0 0 0 4px #FFFFFF;
            padding: 40px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
        }

        /* Interactive Map Styles */
        #mapContainer {
            position: fixed;
            inset: 0;
            background: #000;
            width: 100vw;
            height: 100vh;
            z-index: 5;
        }

        #mapWrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #mapImage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
        }

        .button-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .level-button {
            position: absolute;
            width: 140px;
            height: 140px;
            background: url('https://github.com/dev-sstoilov/grammar/blob/main/rock.png?raw=true') no-repeat center / contain;
            border: none;
            color: rgb(89, 43, 23);
            font-family: "ADYSV6-Bold", 'Fredoka', system-ui, sans-serif;
            font-size: 56px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 18px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            filter: none;
            opacity: 1;
        }

            .level-button:hover {
                transform: translate(-50%, -50%);
            }

            .level-button.locked {
                cursor: not-allowed;
                pointer-events: auto;
                opacity: 0.7;
                filter: grayscale(0.5);
            }

                .level-button.locked:hover {
                    transform: translate(-50%, -50%);
                }

            .level-button.previous {
                cursor: not-allowed;
                pointer-events: auto;
                filter: none;
                opacity: 1;
            }

        #frog {
            position: absolute;
            width: 192px;
            left: 748px;
            top: 898px;
            pointer-events: none;
            user-select: none;
            z-index: 30;
        }

        .location-indicator {
            position: absolute;
            width: 80px;
            height: auto;
            z-index: 20;
            pointer-events: none;
            transform: translate(-50%, -150%);
        }

        .fish {
            position: absolute;
            width: 54px;
            pointer-events: none;
            opacity: 0;
            z-index: 25;
            transform-origin: 50% 50%;
        }

        @keyframes fishJump {
            0% {
                transform: translate(-50%, 28px) rotate(-45deg);
                opacity: 0;
            }
            10% {
                transform: translate(6px, -6px) rotate(-45deg);
                opacity: 1;
            }
            32% {
                transform: translate(22px, -36px) rotate(-22deg);
                opacity: 1;
            }
            48% {
                transform: translate(34px, -40px) rotate(0deg);
                opacity: 1;
            }
            64% {
                transform: translate(46px, -14px) rotate(22deg);
                opacity: 1;
            }
            80% {
                transform: translate(56px, 16px) rotate(48deg);
                opacity: 0.45;
            }
            100% {
                transform: translate(62px, 38px) rotate(62deg);
                opacity: 0;
            }
        }

        #contentArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            text-align: center;
            direction: ltr;
        }

        #navButtons {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 60px;
            z-index: 100;
        }

        .nav-button {
            width: 100px;
            height: 100px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
            background-color: transparent !important;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        #backButton {
            background-image: url('https://github.com/dev-sstoilov/grammar/blob/main/backward_btn.png?raw=true');
        }

        #forwardButton {
            background-image: url('https://github.com/dev-sstoilov/grammar/blob/main/forward_btn.png?raw=true');
        }

        .lesson-content {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .lesson-title {
            color: #1E88E5;
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 rgba(255, 215, 0, 0.3);
        }

        #videoContainer {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 20px;
            overflow: hidden;
            border: 6px solid #1E88E5;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .youtube-video {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .drag-sentence {
            font-size: 2.5rem;
            color: #333;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 20px;
            border: 3px dashed #FFD700;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: center;
            direction: ltr;
        }

        .drop-zone {
            display: inline-block;
            min-width: 120px;
            height: 70px;
            background: rgba(30, 136, 229, 0.1);
            border: 3px dashed #1E88E5;
            border-radius: 15px;
            margin: 0 10px;
            vertical-align: middle;
            position: relative;
        }

            .drop-zone.active {
                border-style: solid;
                background: rgba(30, 136, 229, 0.2);
            }

            .drop-zone.correct {
                border-color: #4CAF50;
                background: rgba(76, 175, 80, 0.2);
            }

            .drop-zone.incorrect {
                border-color: #F44336;
                background: rgba(244, 67, 54, 0.2);
            }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            padding: 30px;
            background: rgba(255, 182, 193, 0.2);
            border-radius: 25px;
            border: 4px solid #FFB6C1;
        }

        .draggable-word {
            padding: 15px 30px;
            background: linear-gradient(135deg, #1E88E5, #2196F3);
            color: white;
            font-size: 1.8rem;
            border-radius: 50px;
            cursor: move;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(30, 136, 229, 0.3);
            border: 3px solid white;
        }

            .draggable-word:hover {
                box-shadow: 0 8px 20px rgba(30, 136, 229, 0.4);
            }

            .draggable-word.dragging {
                opacity: 0.7;
            }

            .draggable-word.disabled {
                background: #bbb !important;
                color: #888 !important;
                border: 3px solid #ccc !important;
                cursor: not-allowed !important;
                pointer-events: none !important;
                opacity: 0.6 !important;
            }

        .click-question {
            font-size: 2rem;
            color: #E91E63;
            margin-bottom: 30px;
            padding: 15px 30px;
            background: white;
            border-radius: 20px;
            border: 4px solid #FFD700;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .click-sentence {
            font-size: 2.5rem;
            color: #333;
            line-height: 1.8;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 25px;
            border: 4px solid #1E88E5;
        }

        .clickable-word {
            display: inline-block;
            padding: 8px 16px;
            margin: 0 5px;
            background: rgba(233, 30, 99, 0.1);
            border: 3px solid #E91E63;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

            .clickable-word:hover {
                background: rgba(233, 30, 99, 0.2);
            }

            .clickable-word.clicked {
                background: rgba(30, 136, 229, 0.2);
                border-color: #1E88E5;
            }

            .clickable-word.incorrect {
                background: rgba(244, 67, 54, 0.2);
                border-color: #F44336;
            }

                .clickable-word.incorrect::after {
                    content: '✗';
                    position: absolute;
                    top: -10px;
                    right: -10px;
                    color: #F44336;
                    font-size: 24px;
                    font-weight: bold;
                }

        /* Character correction styles */
        .word-display {
            font-size: 4rem;
            color: #333;
            margin: 40px 0;
            padding: 30px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 25px;
            border: 4px solid #1E88E5;
            letter-spacing: 8px;
        }

        .clickable-char {
            display: inline-block;
            padding: 10px;
            margin: 0 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 10px;
        }

            .clickable-char:hover {
                background: rgba(233, 30, 99, 0.2);
            }

            .clickable-char.selected {
                background: rgba(255, 215, 0, 0.5);
                border: 3px solid #FFD700;
            }

        .correction-options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            padding: 30px;
            background: rgba(255, 182, 193, 0.2);
            border-radius: 25px;
            border: 4px solid #FFB6C1;
        }

        .correction-option {
            padding: 15px 30px;
            background: linear-gradient(135deg, #E91E63, #F06292);
            color: white;
            font-size: 2rem;
            border-radius: 50px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3);
            border: 3px solid white;
        }

            .correction-option:hover {
                box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
            }

            .correction-option.disabled {
                background: #bbb !important;
                color: #888 !important;
                border: 3px solid #ccc !important;
                cursor: not-allowed !important;
                pointer-events: none !important;
                opacity: 0.6 !important;
            }

        .feedback {
            font-size: 2rem;
            padding: 20px 40px;
            border-radius: 20px;
            margin-top: 20px;
            animation: pop 0.3s ease;
        }

            .feedback.correct {
                color: #4CAF50;
                background: rgba(76, 175, 80, 0.1);
                border: 3px solid #4CAF50;
            }

            .feedback.incorrect {
                color: #F44336;
                background: rgba(244, 67, 54, 0.1);
                border: 3px solid #F44336;
            }

        @keyframes pop {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .progress-dots {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .progress-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #BDBDBD;
            transition: all 0.3s ease;
        }

            .progress-dot.active {
                background: #FFD700;
                transform: scale(1.3);
            }

            .progress-dot.completed {
                background: #4CAF50;
            }

        @media (max-width: 768px) {
            #mainContainer {
                width: 95%;
                height: 85vh;
                padding: 20px;
                border-radius: 30px;
            }

            .lesson-title {
                font-size: 2rem;
            }

            .drag-sentence, .click-sentence {
                font-size: 1.8rem;
            }

            .draggable-word {
                font-size: 1.4rem;
                padding: 12px 24px;
            }

            .click-question {
                font-size: 1.6rem;
            }

            .word-display {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

            .correction-option {
                font-size: 1.5rem;
                padding: 12px 24px;
            }

            .level-button {
                width: 60px;
                height: 60px;
                font-size: 24px;
                padding-top: 8px;
            }

            #frog {
                width: 120px;
                left: 50%;
                top: 80%;
                transform: translateX(-50%);
            }

            .location-indicator {
                width: 50px;
            }

            .fish {
                width: 36px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="backgroundWrapper"></div>

    <div id="mapContainer">

            <div class="button-container" id="buttonContainer"></div>

    <div id="navButtons" class="hidden">

    <script>
        const correctSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3');
        const incorrectSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3');

        let currentLevel = 1;
        let currentLessonIndex = 0;
        let completedLessons = new Set();
        let mistakesCount = 0;
        let currentLessonData = null;

        const CACHE_KEY = 'grammar_garden_progress';

        function saveProgress() {
            const data = {
                currentLevel,
                currentLessonIndex,
                completedLessons: Array.from(completedLessons),
                mistakesCount
            };
            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        }

        function loadProgress() {
            const data = localStorage.getItem(CACHE_KEY);
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    if (typeof parsed.currentLevel === 'number') currentLevel = parsed.currentLevel;
                    if (typeof parsed.currentLessonIndex === 'number') currentLessonIndex = parsed.currentLessonIndex;
                    if (Array.isArray(parsed.completedLessons)) completedLessons = new Set(parsed.completedLessons);
                    if (typeof parsed.mistakesCount === 'number') mistakesCount = parsed.mistakesCount;
                } catch (e) {
                    // Ignore parse errors
                }
            }
        }

        function clearProgress() {
            localStorage.removeItem(CACHE_KEY);
        }

                    sentence: "Ако вали {глагол}, ще остана {съществително}.",
                    wordBank: ["у дома", "дъжд", "училище", "вътре", "запушва"],
                    correctAnswers: ["дъжд", "у дома"],
                    dropZones: 2
                },
                {
                    type: "click_answer",
                    title: "Финално предизвикателство",
                    question: "Намери всички грешки в изречението:",
                    sentence: "Децата играят навън когато слънцето свети ярко.",
                    correctAnswer: "когато",
                    options: ["децата", "играят", "навън", "когато", "слънцето", "свети", "ярко"]
                }
            ]
        };

        const BUTTON_POSITIONS = [
            { x: 0.0563, y: 0.1162 }, { x: 0.1680, y: 0.2488 }, { x: 0.1742, y: 0.4780 },
            { x: 0.2199, y: 0.7237 }, { x: 0.3496, y: 0.6750 }, { x: 0.4043, y: 0.4639 },
            { x: 0.5016, y: 0.2998 }, { x: 0.6082, y: 0.4843 }, { x: 0.6859, y: 0.6601 },
            { x: 0.7902, y: 0.4945 }, { x: 0.8949, y: 0.4741 }, { x: 0.9406, y: 0.7590 }
        ];

        let lastFishIndex = -1;

        function initializeMap() {
            const wrapper = document.getElementById('mapWrapper');
            const container = document.getElementById('buttonContainer');

            container.innerHTML = '';

            const existingIndicators = document.querySelectorAll('.location-indicator');
            existingIndicators.forEach(indicator => indicator.remove());

            BUTTON_POSITIONS.forEach((pos, index) => {
                const levelNum = index + 1;
                const btn = document.createElement('button');
                btn.className = 'level-button';
                btn.textContent = levelNum;
                btn.dataset.level = levelNum;

                const w = wrapper.clientWidth;
                const h = wrapper.clientHeight;
                btn.style.left = `${pos.x * w}px`;
                btn.style.top = `${pos.y * h}px`;

                if (levelNum < currentLevel) {
                    btn.classList.add('previous');
                } else if (levelNum === currentLevel) {
                    btn.onclick = () => selectLevel(levelNum);

                    const indicator = document.createElement('img');
                    indicator.src = 'https://github.com/dev-sstoilov/grammar/blob/main/location.png?raw=true';
                    indicator.className = 'location-indicator';
                    indicator.style.left = btn.style.left;
                    indicator.style.top = btn.style.top;
                    wrapper.appendChild(indicator);
                } else {
                    btn.classList.add('locked');
                }

                container.appendChild(btn);
            });
        }

        function spawnFishAt(index) {
            const wrapper = document.getElementById('mapWrapper');
            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            const p = BUTTON_POSITIONS[index];

            const fish = document.createElement('img');
            fish.src = 'https://github.com/dev-sstoilov/grammar/blob/main/fish.png?raw=true';
            fish.className = 'fish';

            const START_OFFSET_X = -40;
            const START_OFFSET_Y = 40;

            fish.style.left = `${p.x * w + START_OFFSET_X}px`;
            fish.style.top = `${p.y * h + START_OFFSET_Y}px`;

            wrapper.appendChild(fish);

            fish.offsetHeight;

            fish.style.animation = 'fishJump 1.8s linear';

            setTimeout(() => fish.remove(), 1900);
        }

        function fishJump() {
            const forbidden = [1, 2, 4, 7, 9];
            let indices = [...BUTTON_POSITIONS.keys()]
                .filter(i => i !== lastFishIndex && !forbidden.includes(i))
                .sort(() => Math.random() - 0.5);

            const doubleJump = Math.random() < 0.1;

            if (indices.length > 0) {
                spawnFishAt(indices[0]);
                lastFishIndex = indices[0];
            }

            if (doubleJump && indices.length > 1) {
                spawnFishAt(indices[1]);
            }
        }

        function goHome() {
            currentLessonIndex = 0;
            saveProgress();
            document.getElementById('mapContainer').classList.remove('hidden');
            document.getElementById('mainContainer').classList.add('hidden');
            document.getElementById('navButtons').classList.add('hidden');
            initializeMap();
        }

        function selectLevel(level) {
            currentLevel = level;
            currentLessonIndex = 0;
            mistakesCount = 0;
            saveProgress();

            document.getElementById('mapContainer').classList.add('hidden');
            document.getElementById('mainContainer').classList.remove('hidden');
            document.getElementById('navButtons').classList.remove('hidden');

            loadLesson();
        }

        function loadLesson() {
            const levelLessons = lessonsData[currentLevel];
            if (!levelLessons || currentLessonIndex >= levelLessons.length) {
                completeLevel();
                return;
            }

            currentLessonData = levelLessons[currentLessonIndex];
            renderLesson(currentLessonData);
            updateProgressDots(currentLessonIndex);
            saveProgress();
        }

        function renderLesson(lesson) {
            const contentArea = document.getElementById('contentArea');

            if (lesson.type === "video") {
                contentArea.innerHTML = `
                    <h1 class="lesson-title">${lesson.title}</h1>
                    <div id="videoContainer">
                        <iframe class="youtube-video"
                            src="${lesson.videoUrl}"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="feedback" id="feedbackMessage">Гледай видеото, за да продължиш...</div>
                `;

                setTimeout(() => {
                    document.getElementById('feedbackMessage').innerHTML = 'Страхотно гледане! <br>Кликни "Напред", за да продължиш.';
                    document.getElementById('feedbackMessage').classList.add('correct');
                }, lesson.duration * 1000);
            }
            else if (lesson.type === "drag_drop") {
                contentArea.innerHTML = `
                    <h1 class="lesson-title">${lesson.title}</h1>
                    <div class="drag-sentence" id="dragSentence">
                        ${renderSentenceWithDropZones(lesson.sentence, lesson.dropZones)}
                    </div>
                    <div class="word-bank" id="wordBank">
                        ${lesson.wordBank.map(word =>
                            `<div class="draggable-word" draggable="true" data-word="${word}">${word}</div>`
                        ).join('')}
                    </div>
                    <div class="feedback" id="feedbackMessage"></div>
                `;

                initializeDragAndDrop(lesson.correctAnswers);
            }
            else if (lesson.type === "click_answer") {
                contentArea.innerHTML = `
                    <h1 class="lesson-title">${lesson.title}</h1>
                    <div class="click-question">${lesson.question}</div>
                    <div class="click-sentence" id="clickSentence">
                        ${renderSentenceWithClickableWords(lesson.sentence, lesson.options)}
                    </div>
                    <div class="feedback" id="feedbackMessage"></div>
                `;

                initializeClickToAnswer(lesson.correctAnswer);
            }
            else if (lesson.type === "char_correction") {
                contentArea.innerHTML = `
                    <h1 class="lesson-title">${lesson.title}</h1>
                    <div class="click-question">${lesson.instruction}</div>
                    <div class="word-display" id="wordDisplay">
                        ${renderWordWithClickableChars(lesson.wrongWord)}
                    </div>
                    <div class="correction-options hidden" id="correctionOptions">
                        ${lesson.correctionOptions.map(char =>
                            `<div class="correction-option" data-char="${char}">${char}</div>`
                        ).join('')}
                    </div>
                    <div class="feedback" id="feedbackMessage"></div>
                `;

                initializeCharCorrection(lesson.wrongCharIndex, lesson.correctChar, lesson.word);
            }
        }

        function renderSentenceWithDropZones(sentence, dropZoneCount) {
            const parts = sentence.split(/{[^}]+}/g);
            let result = '';

            for (let i = 0; i < parts.length; i++) {
                result += parts[i];
                if (i < dropZoneCount) {
                    result += `<span class="drop-zone" data-index="${i}"></span>`;
                }
            }
            return result;
        }

        function renderSentenceWithClickableWords(sentence, options) {
            const words = sentence.split(' ');
            return words.map(word => {
                const cleanWord = word.replace(/[.,!?]/g, '').toLowerCase();
                if (options.includes(cleanWord)) {
                    return `<span class="clickable-word" data-word="${cleanWord}">${word}</span>`;
                }
                return word + ' ';
            }).join(' ');
        }

        function renderWordWithClickableChars(word) {
            return word.split('').map((char, index) =>
                `<span class="clickable-char" data-index="${index}">${char}</span>`
            ).join('');
        }

        function initializeDragAndDrop(correctAnswers) {
            const draggables = document.querySelectorAll('.draggable-word');
            const dropZones = document.querySelectorAll('.drop-zone');
            let droppedWords = new Array(correctAnswers.length).fill(null);
            let correctCount = 0;

            // Add click-to-place functionality
            draggables.forEach(draggable => {
                // Drag start
                draggable.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.dataset.word);
                    e.target.classList.add('dragging');
                });

                draggable.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                });

                // Click to place
                draggable.addEventListener('click', (e) => {
                    if (draggable.classList.contains('disabled')) return;

                    const word = draggable.dataset.word;
                    
                    // Find first empty drop zone
                    const emptyZone = Array.from(dropZones).find(zone => !zone.innerHTML.trim());
                    
                    if (emptyZone) {
                        placeWordInZone(word, emptyZone, dropZones, droppedWords, correctAnswers, draggable);
                    }
                });
            });

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('active');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('active');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('active');

                    const word = e.dataTransfer.getData('text/plain');
                    const draggableElement = Array.from(draggables).find(d => d.dataset.word === word);
                    
                    placeWordInZone(word, zone, dropZones, droppedWords, correctAnswers, draggableElement);
                });
            });

            function placeWordInZone(word, zone, dropZones, droppedWords, correctAnswers, draggableElement) {
                const index = parseInt(zone.dataset.index);

                if (droppedWords.includes(word)) {
                    const prevIndex = droppedWords.indexOf(word);
                    if (prevIndex !== -1) {
                        dropZones[prevIndex].innerHTML = '';
                        droppedWords[prevIndex] = null;
                    }
                }

                zone.innerHTML = `<span class="draggable-word">${word}</span>`;
                droppedWords[index] = word;

                correctCount = 0;
                droppedWords.forEach((w, i) => {
                    if (w === correctAnswers[i]) {
                        dropZones[i].classList.add('correct');
                        dropZones[i].classList.remove('incorrect');
                        correctCount++;
                    } else if (w !== null) {
                        dropZones[i].classList.add('incorrect');
                        dropZones[i].classList.remove('correct');
                    }
                });

                if (!correctAnswers.includes(word)) {
                    const wordBank = document.getElementById('wordBank');
                    const wordElems = wordBank.querySelectorAll('.draggable-word');
                    wordElems.forEach(wEl => {
                        if (wEl.dataset.word === word) {
                            wEl.classList.add('disabled');
                            wEl.setAttribute('draggable', 'false');
                        }
                    });
                }

                if (correctCount === correctAnswers.length) {
                    document.getElementById('feedbackMessage').textContent = 'Отлично! Всичко е вярно!';
                    document.getElementById('feedbackMessage').classList.add('correct');
                    document.getElementById('feedbackMessage').classList.remove('incorrect');
                    correctSound.play();

                    completedLessons.add(currentLevel);
                    setTimeout(() => {
                        if (currentLessonIndex === lessonsData[currentLevel].length - 1) {
                            currentLevel++;
                        }
                        nextLesson();
                    }, 1500);
                } else if (droppedWords.every(w => w !== null)) {
                    mistakesCount++;
                    document.getElementById('feedbackMessage').textContent = 'Не съвсем вярно. Опитай отново!';
                    document.getElementById('feedbackMessage').classList.add('incorrect');
                    document.getElementById('feedbackMessage').classList.remove('correct');
                    incorrectSound.play();

                    if (mistakesCount >= 3) {
                        setTimeout(() => {
                            mistakesCount = 0;
                            currentLessonIndex = Math.max(0, currentLessonIndex - 1);
                            loadLesson();
                        }, 1000);
                    }
                }
            }
        }

        function initializeClickToAnswer(correctAnswer) {
            const clickableWords = document.querySelectorAll('.clickable-word');
            let answeredCorrectly = false;

            clickableWords.forEach(word => {
                word.addEventListener('click', () => {
                    if (answeredCorrectly) return;

                    const selectedWord = word.dataset.word;

                    if (selectedWord === correctAnswer.toLowerCase()) {
                        word.classList.add('clicked');
                        word.classList.remove('incorrect');

                        document.getElementById('feedbackMessage').textContent = 'Перфектно! Намери го!';
                        document.getElementById('feedbackMessage').classList.add('correct');
                        document.getElementById('feedbackMessage').classList.remove('incorrect');
                        correctSound.play();

                        answeredCorrectly = true;

                        completedLessons.add(currentLevel);
                        setTimeout(() => {
                            if (currentLessonIndex === lessonsData[currentLevel].length - 1) {
                                currentLevel++;
                            }
                            nextLesson();
                        }, 1500);
                    } else {
                        word.classList.add('incorrect');
                        mistakesCount++;

                        document.getElementById('feedbackMessage').textContent = 'Опитай друга дума!';
                        document.getElementById('feedbackMessage').classList.add('incorrect');
                        document.getElementById('feedbackMessage').classList.remove('correct');
                        incorrectSound.play();

                        word.style.pointerEvents = 'none';

                        if (mistakesCount >= 3) {
                            setTimeout(() => {
                                mistakesCount = 0;
                                currentLessonIndex = Math.max(0, currentLessonIndex - 1);
                                loadLesson();
                            }, 1000);
                        }
                    }
                });
            });
        }

        function initializeCharCorrection(wrongCharIndex, correctChar, correctWord) {
            const clickableChars = document.querySelectorAll('.clickable-char');
            const correctionOptions = document.getElementById('correctionOptions');
            const correctionOptionElements = document.querySelectorAll('.correction-option');
            let selectedCharIndex = null;
            let answeredCorrectly = false;

            // Step 1: Click on wrong character
            clickableChars.forEach(char => {
                char.addEventListener('click', () => {
                    if (answeredCorrectly) return;

                    const charIndex = parseInt(char.dataset.index);

                    // Remove previous selection
                    clickableChars.forEach(c => c.classList.remove('selected'));

                    if (charIndex === wrongCharIndex) {
                        // Correct character selected
                        char.classList.add('selected');
                        selectedCharIndex = charIndex;

                        // Show correction options
                        correctionOptions.classList.remove('hidden');
                        document.getElementById('feedbackMessage').textContent = 'Добре! Сега избери правилната буква:';
                        document.getElementById('feedbackMessage').classList.add('correct');
                        document.getElementById('feedbackMessage').classList.remove('incorrect');
                    } else {
                        // Wrong character selected
                        mistakesCount++;
                        document.getElementById('feedbackMessage').textContent = 'Това не е грешната буква. Опитай отново!';
                        document.getElementById('feedbackMessage').classList.add('incorrect');
                        document.getElementById('feedbackMessage').classList.remove('correct');
                        incorrectSound.play();

                        if (mistakesCount >= 3) {
                            setTimeout(() => {
                                mistakesCount = 0;
                                currentLessonIndex = Math.max(0, currentLessonIndex - 1);
                                loadLesson();
                            }, 1000);
                        }
                    }
                });
            });

            // Step 2: Click on correction option
            correctionOptionElements.forEach(option => {
                option.addEventListener('click', () => {
                    if (answeredCorrectly || selectedCharIndex === null) return;

                    const selectedChar = option.dataset.char;

                    if (selectedChar === correctChar) {
                        // Correct answer
                        option.style.background = 'linear-gradient(135deg, #4CAF50, #66BB6A)';
                        
                        // Update word display
                        const wordChars = correctWord.split('');
                        document.getElementById('wordDisplay').innerHTML = wordChars.map((char, index) =>
                            `<span class="clickable-char">${char}</span>`
                        ).join('');

                        document.getElementById('feedbackMessage').textContent = 'Браво! Думата е поправена!';
                        document.getElementById('feedbackMessage').classList.add('correct');
                        document.getElementById('feedbackMessage').classList.remove('incorrect');
                        correctSound.play();

                        answeredCorrectly = true;

                        completedLessons.add(currentLevel);
                        setTimeout(() => {
                            if (currentLessonIndex === lessonsData[currentLevel].length - 1) {
                                currentLevel++;
                            }
                            nextLesson();
                        }, 1500);
                    } else {
                        // Wrong answer
                        option.classList.add('disabled');
                        mistakesCount++;

                        document.getElementById('feedbackMessage').textContent = 'Не съвсем! Опитай друга буква!';
                        document.getElementById('feedbackMessage').classList.add('incorrect');
                        document.getElementById('feedbackMessage').classList.remove('correct');
                        incorrectSound.play();

                        if (mistakesCount >= 3) {
                            setTimeout(() => {
                                mistakesCount = 0;
                                currentLessonIndex = Math.max(0, currentLessonIndex - 1);
                                loadLesson();
                            }, 1000);
                        }
                    }
                });
            });
        }

        function nextLesson() {
            currentLessonIndex++;
            mistakesCount = 0;
            saveProgress();
            loadLesson();
        }

        function previousLesson() {
            currentLessonIndex = Math.max(0, currentLessonIndex - 1);
            mistakesCount = 0;
            saveProgress();
            loadLesson();
        }

        function completeLevel() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <h1 class="lesson-title">🎉 Ниво ${currentLevel} завършено! 🎉</h1>
                <div style="font-size: 2rem; color: #4CAF50; margin: 30px 0;">
                    Страхотно се справяш!
                </div>
                <div style="font-size: 1.8rem; color: #666; max-width: 600px;">
                    Чудесна работа! Научи много нови неща!
                </div>
                <button class="start-button" style="margin-top: 40px; padding: 15px 40px; font-size: 1.8rem; background: #1E88E5;" onclick="goHome()">
                    Обратно към картата
                </button>
            `;
            updateProgressDots(-1);
            saveProgress();
        }

        function updateProgressDots(currentIndex) {
            const progressDots = document.getElementById('progressDots');
            const levelLessons = lessonsData[currentLevel] || [];

            progressDots.innerHTML = '';

            const maxDots = Math.min(levelLessons.length, 20);
            for (let i = 0; i < maxDots; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';

                if (i < currentIndex) {
                    dot.classList.add('completed');
                } else if (i === currentIndex) {
                    dot.classList.add('active');
                }

                progressDots.appendChild(dot);
            }
        }

        window.addEventListener('load', () => {
            loadProgress();
            if (typeof currentLevel === 'number' && lessonsData[currentLevel] && typeof currentLessonIndex === 'number' && currentLessonIndex < lessonsData[currentLevel].length) {
                document.getElementById('mapContainer').classList.add('hidden');
                document.getElementById('mainContainer').classList.remove('hidden');
                document.getElementById('navButtons').classList.remove('hidden');
                loadLesson();
            } else {
                document.getElementById('mapContainer').classList.remove('hidden');
                initializeMap();
            }

            setInterval(fishJump, 2000);

            window.addEventListener('resize', initializeMap);
        });

        window.addEventListener('popstate', function(event) {
            goHome();
        });
    </script>
</body>
</html>
